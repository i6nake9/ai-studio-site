<!doctype html><html lang="uk"><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700&family=Unbounded:wght@600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#F4F6F2;color:#0F1A15;font-family:Onest,sans-serif;display:grid;grid-template-columns:1.25fr .75fr;gap:48px;padding:64px 72px;align-items:center}
.logo{font-family:Unbounded;font-weight:600;font-size:30px;letter-spacing:-.02em}.logo b{color:#08703F;font-weight:600}
.eye{margin-top:44px;font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#08703F}
h1{margin-top:16px;font-size:55px;line-height:1.06;letter-spacing:-.03em;font-weight:700}
.row{margin-top:36px;display:flex;gap:14px;align-items:center}
.btn{background:#34E28B;color:#0B1F15;font-weight:700;font-size:22px;padding:16px 26px;border-radius:12px}
.sub{font-size:21px;color:#45544C;font-weight:500}
.card{background:#fff;border:1px solid #D9E0DA;border-radius:16px;padding:22px 26px;box-shadow:0 24px 48px -32px rgba(15,26,21,.35)}
.card p{font-weight:700;font-size:20px;padding-bottom:12px}
ul{padding:0}
li{list-style:none;display:flex;align-items:center;gap:14px;border-top:1px solid #E6EBE6;padding:13px 0;font-size:19px;font-weight:500}
.c{width:24px;height:24px;border-radius:7px;background:#34E28B;flex:none;display:grid;place-items:center}
.c svg{width:14px;height:14px}
.t{color:#5B6A62;text-decoration:line-through;text-decoration-color:#08703F}
.o{width:24px;height:24px;border-radius:7px;border:2px solid #0F1A15;flex:none}
.h{font-weight:700}
</style>
<div>
<div class="logo"><b>не</b>рутина</div>
<div class="eye">Автоматизація та ШІ для бізнесу</div>
<h1>ШІ-агенти й автоматизація, які забирають рутину у вашої команди</h1>
<div class="row"><span class="btn">Безкоштовний аудит</span><span class="sub">пілот від 5 днів</span></div>
</div>
<div class="card"><p>Рутина вашої команди</p><ul>
<li><span class="c"><svg viewBox="0 0 14 14" fill="none" stroke="#0B1F15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg></span><span class="t">Відповісти клієнтам</span></li>
<li><span class="c"><svg viewBox="0 0 14 14" fill="none" stroke="#0B1F15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg></span><span class="t">Замовлення в CRM</span></li>
<li><span class="c"><svg viewBox="0 0 14 14" fill="none" stroke="#0B1F15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg></span><span class="t">ТТН Нової Пошти</span></li>
<li><span class="c"><svg viewBox="0 0 14 14" fill="none" stroke="#0B1F15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg></span><span class="t">Ціни конкурентів</span></li>
<li><span class="o"></span><span class="h">Переговори й рішення</span></li>
</ul></div>
</html>
